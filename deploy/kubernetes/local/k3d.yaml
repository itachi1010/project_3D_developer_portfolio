apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: portfolio-local
servers: 1
agents: 0
image: rancher/k3s:v1.35.9-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6446"
ports:
  - port: "127.0.0.1:8099:80"
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
