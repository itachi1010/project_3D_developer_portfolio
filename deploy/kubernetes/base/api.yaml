apiVersion: v1
kind: Service
metadata:
  name: portfolio-api
spec:
  selector: {app: portfolio-api}
  ports: [{name: http, port: 5001, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
spec:
  replicas: 1
  # No surge: this small app must fit inside the EXISTING 300m demos CPU cap.
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: portfolio-api}
  template:
    metadata:
      labels: {app: portfolio-api, project: benny-portfolio}
    spec:
      priorityClassName: demos-priority
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: benny-portfolio-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: portfolio-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: portfolio-secrets, key: DATABASE_URL}
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: portfolio-secrets, key: ADMIN_USERNAME}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: portfolio-secrets, key: ADMIN_PASSWORD}
          ports: [{name: http, containerPort: 5001}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
