apiVersion: v1
kind: Service
metadata:
  name: portfolio-db
spec:
  clusterIP: None
  selector: {app: portfolio-db}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portfolio-db
spec:
  serviceName: portfolio-db
  replicas: 1
  selector:
    matchLabels: {app: portfolio-db}
  template:
    metadata:
      labels: {app: portfolio-db, project: benny-portfolio}
    spec:
      priorityClassName: demos-priority
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:15-bookworm
          args: [postgres, -c, shared_buffers=32MB, -c, max_connections=15, -c, work_mem=2MB, -c, maintenance_work_mem=16MB]
          env:
            - {name: POSTGRES_DB, value: portfolio}
            - {name: POSTGRES_USER, value: portfolio}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: portfolio-secrets, key: POSTGRES_PASSWORD}
          ports: [{name: postgres, containerPort: 5432}]
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 150m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [pg_isready, -U, portfolio, -d, portfolio]}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, portfolio, -d, portfolio]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [pg_isready, -U, portfolio, -d, portfolio]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 2Gi}
