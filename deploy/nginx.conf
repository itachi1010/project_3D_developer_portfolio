worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
        location /api/ {
            proxy_pass http://portfolio-api:5001;
            proxy_set_header Host $host;
            # Overwrite arbitrary browser headers; ingress real-IP trust is configured separately.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
        location /assets/ { expires 7d; try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
